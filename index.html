<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" type="module"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css?family=Noto+Sans+Hatran:regular" rel="stylesheet" />
    <title>Any Question</title>
</head>
<body>
    <div class="container">

        <h1>Any Question</h1>

        <div class="chat-box">    
            
        </div>
        
        <form action="#">
            <input id="prompt-input" type="text" autocomplete="off" placeholder="Ask your question here!!">
            <button type="submit">Send</button>
        </form>

        <div class="pop-up-note">
            <p>This Chatbot is not remember anything about any previous chat.<br> It means that every times you type its a new chat.</p>
            <form action="">
                <input type="text" class="save-name" autocomplete="off" placeholder="Enter Your Name">
                <button type="submit">Next</button>
            </form>
        </div>
    </div>
</body>
</html>
